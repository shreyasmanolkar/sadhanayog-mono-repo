# Project MCP declarations for Codex (trusted repo only).
# Credentials stay in environment variables. Do not paste secret values here.
# Default posture: approval / allowlist. See docs/development/mcp.md.
#
# Do not add: repository-search MCP, production D1/R2, a browser profile,
# shell-as-MCP, Cloudflare account mutation (mcp.cloudflare.com), secrets
# manager, Sentry, or Figma.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
enabled = true
enabled_tools = ["resolve-library-id", "query-docs"]
default_tools_approval_mode = "prompt"

[mcp_servers.cloudflare_docs]
url = "https://docs.mcp.cloudflare.com/mcp"
enabled = true
default_tools_approval_mode = "prompt"

# Specialized. Disabled until a web/QA/review agent needs a local/dev browser.
# Headed mode requires a human. Isolated profile; downloads stay in /tmp.
[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@0.0.79",
  "--headless",
  "--isolated",
  "--allowed-origins=http://127.0.0.1:5173;http://localhost:5173;http://127.0.0.1:8787;http://localhost:8787",
  "--output-dir=/tmp/sadhanayog-playwright-mcp",
]
enabled = false
default_tools_approval_mode = "approve"
startup_timeout_sec = 60
tool_timeout_sec = 60
