<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sadhana Yog Track</title>
    <style>
/* ═══════════════════════════════════════════════════════════════════════════════
   Sadhana Yog Track — board
   A Linear-fidelity kanban over the markdown files in ../issues/.
   No external fonts, no CDN, no build step: the static export must open from file://.
   ═══════════════════════════════════════════════════════════════════════════════ */

:root {
  --bg: #0c0c0e;
  --bg-header: #0f0f11;
  --col-header: #131316;
  --card: #1a1a1e;
  --card-hover: #212127;
  --card-active: #26262d;
  --border: #26262c;
  --border-soft: #1d1d22;
  --line: #202026;

  --text: #eeeef0;
  --text-2: #d3d3d8;
  --text-3: #8a8f98;
  --text-4: #64686f;

  --accent: #5e6ad2;
  --accent-soft: #5e6ad233;
  --amber: #f2c94c;
  --orange: #f2994a;
  --red: #eb5757;
  --green: #4cb782;
  --purple: #bb87fc;
  --blue: #4ea7fc;

  --radius: 8px;
  --radius-sm: 5px;
  --shadow-card: 0 1px 2px rgb(0 0 0 / 0.35);
  --shadow-pop: 0 10px 38px rgb(0 0 0 / 0.55), 0 0 0 1px var(--border);

  --header-h: 46px;
  --subheader-h: 42px;
  --col-w: 340px;

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    "Inter var", "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

input,
select,
textarea {
  font: inherit;
  color: inherit;
}

.boot {
  display: grid;
  place-items: center;
  height: 100vh;
  color: var(--text-3);
}

svg {
  display: block;
  flex: none;
}

/* ── App shell ───────────────────────────────────────────────────────────────── */

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ── Header: breadcrumb ──────────────────────────────────────────────────────── */

.header {
  display: flex;
  align-items: center;
  gap: 8px;
  height: var(--header-h);
  min-height: var(--header-h);
  padding: 0 14px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border-soft);
}

.icon-btn {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: var(--radius-sm);
  color: var(--text-3);
  transition: background 0.12s, color 0.12s;
}

.icon-btn:hover {
  background: var(--card-hover);
  color: var(--text);
}

.icon-btn.is-on {
  background: var(--card-active);
  color: var(--text);
}

.crumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.crumb {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 6px;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  font-weight: 500;
  white-space: nowrap;
  transition: background 0.12s;
}

.crumb:hover {
  background: var(--card-hover);
}

.crumb-sep {
  color: var(--text-4);
  font-size: 12px;
}

.crumb .glyph {
  color: var(--accent);
}

.crumb .glyph--cycle {
  color: var(--purple);
}

.star {
  color: var(--amber);
}

.header .spacer {
  flex: 1;
}

.badge-ro {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-3);
  font-size: 11px;
}

/* ── Sub-header: count + view controls ───────────────────────────────────────── */

.subheader {
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--subheader-h);
  min-height: var(--subheader-h);
  padding: 0 16px;
}

.count {
  color: var(--text-3);
  font-size: 12.5px;
}

.subheader .spacer {
  flex: 1;
}

.search {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 8px;
  background: var(--card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  color: var(--text-3);
  transition: border-color 0.12s;
}

.search:focus-within {
  border-color: var(--accent);
}

.search input {
  width: 150px;
  background: none;
  border: 0;
  outline: 0;
  font-size: 12.5px;
}

.search input::placeholder {
  color: var(--text-4);
}

.search kbd {
  padding: 1px 4px;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-4);
  font-family: inherit;
  font-size: 10px;
}

.ctl {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 8px;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  color: var(--text-3);
  font-size: 12px;
  transition: background 0.12s, color 0.12s;
}

.ctl:hover {
  background: var(--card-hover);
  color: var(--text);
}

.ctl select {
  background: none;
  border: 0;
  outline: 0;
  color: inherit;
  font-size: 12px;
  cursor: pointer;
}

.ctl select option {
  background: var(--card);
}

/* ── Board ───────────────────────────────────────────────────────────────────── */

.board {
  display: flex;
  flex: 1;
  gap: 0;
  min-height: 0;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0 8px 8px;
  scrollbar-width: thin;
}

.col {
  display: flex;
  flex-direction: column;
  width: var(--col-w);
  min-width: var(--col-w);
  min-height: 0;
  padding: 0 8px;
  border-right: 1px solid var(--line);
}

.col:last-child {
  border-right: 0;
}

.col-head {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 6px;
  margin-bottom: 4px;
  background: var(--col-header);
  border-radius: var(--radius-sm);
}

.col-title {
  color: var(--text);
  font-weight: 500;
  font-size: 12.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.col-count {
  color: var(--text-3);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.col-dates {
  color: var(--text-4);
  font-size: 11.5px;
  white-space: nowrap;
}

.col-head .spacer {
  flex: 1;
}

.col-head .icon-btn {
  width: 22px;
  height: 22px;
  opacity: 0;
  transition: opacity 0.12s;
}

.col:hover .col-head .icon-btn {
  opacity: 1;
}

.col-body {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  min-height: 0;
  padding: 2px 2px 40px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #3a3a42 transparent;
}

.col-body::-webkit-scrollbar {
  width: 6px;
}

.col-body::-webkit-scrollbar-thumb {
  background: #3a3a42;
  border-radius: 3px;
}

.col-body::-webkit-scrollbar-track {
  background: transparent;
}

.col-body.is-over {
  background: var(--accent-soft);
  border-radius: var(--radius);
  outline: 1px dashed var(--accent);
  outline-offset: -1px;
}

.col-empty {
  padding: 14px 8px;
  color: var(--text-4);
  font-size: 12px;
  text-align: center;
}

/* ── Card ────────────────────────────────────────────────────────────────────── */

.card {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 10px 11px 9px;
  background: var(--card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
}

.card:hover {
  background: var(--card-hover);
  border-color: var(--border);
}

.card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.card.is-dragging {
  opacity: 0.4;
}

.card.is-selected {
  border-color: var(--accent);
}

.card-top {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}

.card-id {
  color: var(--text-4);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.card-parent {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  color: var(--text-4);
  font-size: 11.5px;
}

.card-parent .t {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.card-top .spacer {
  flex: 1;
}

.avatar {
  display: grid;
  place-items: center;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  color: #fff;
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.avatar--none {
  border: 1px dashed #4a4a52;
  color: var(--text-4);
  background: transparent;
}

.card-title {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  color: var(--text);
  font-size: 13px;
  line-height: 1.38;
}

.card-title svg {
  margin-top: 1px;
}

.card-title .t {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-3);
  font-size: 11px;
  white-space: nowrap;
  max-width: 160px;
}

.chip .t {
  overflow: hidden;
  text-overflow: ellipsis;
}

.chip--ghost {
  width: 20px;
  padding: 0;
  justify-content: center;
  border-color: transparent;
  color: var(--text-4);
}

.chip--ghost:hover {
  border-color: var(--border);
  color: var(--text-2);
}

.chip--bare {
  border-color: transparent;
  padding: 0 2px;
}

.chip--blocked {
  border-color: #5a2a2c;
  color: var(--red);
}

.chip--project {
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 10px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
}

.card-foot {
  color: var(--text-4);
  font-size: 11px;
}

/* ── Detail drawer ───────────────────────────────────────────────────────────── */

.scrim {
  position: fixed;
  inset: 0;
  background: rgb(0 0 0 / 0.5);
  opacity: 0;
  animation: fade 0.14s var(--ease) forwards;
}

@keyframes fade {
  to {
    opacity: 1;
  }
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  width: min(760px, 82vw);
  background: var(--bg-header);
  border-left: 1px solid var(--border);
  box-shadow: -20px 0 60px rgb(0 0 0 / 0.5);
  transform: translateX(12px);
  opacity: 0;
  animation: slide-in 0.2s var(--ease) forwards;
}

@keyframes slide-in {
  to {
    transform: none;
    opacity: 1;
  }
}

.drawer-head {
  display: flex;
  align-items: center;
  gap: 8px;
  height: var(--header-h);
  min-height: var(--header-h);
  padding: 0 12px;
  border-bottom: 1px solid var(--border-soft);
}

.drawer-head .id {
  color: var(--text-3);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.drawer-head .spacer {
  flex: 1;
}

.drawer-head .file {
  color: var(--text-4);
  font-size: 11.5px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}

.drawer-body {
  display: grid;
  grid-template-columns: 1fr 236px;
  flex: 1;
  min-height: 0;
}

.drawer-main {
  padding: 20px 24px 60px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #3a3a42 transparent;
}

.drawer-main::-webkit-scrollbar {
  width: 8px;
}

.drawer-main::-webkit-scrollbar-thumb {
  background: #3a3a42;
  border-radius: 4px;
}

.drawer-title {
  margin: 0 0 4px;
  color: var(--text);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

.drawer-desc {
  margin: 0 0 18px;
  color: var(--text-3);
  font-size: 13.5px;
}

.drawer-side {
  padding: 18px 16px;
  border-left: 1px solid var(--border-soft);
  overflow-y: auto;
  scrollbar-width: thin;
}

.field {
  margin-bottom: 14px;
}

.field-label {
  display: block;
  margin-bottom: 5px;
  color: var(--text-4);
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.field-value {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 26px;
  padding: 3px 6px;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  font-size: 12.5px;
}

select.field-value {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border-soft);
  cursor: pointer;
  transition: border-color 0.12s;
}

select.field-value:hover {
  border-color: var(--border);
}

select.field-value:disabled {
  cursor: default;
  opacity: 0.7;
}

.field-value option {
  background: var(--card);
}

.rel {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  font-size: 12px;
  cursor: pointer;
  width: 100%;
  text-align: left;
}

.rel:hover {
  background: var(--card-hover);
}

.rel .rid {
  color: var(--text-4);
  font-variant-numeric: tabular-nums;
  flex: none;
}

.rel .rt {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

/* ── Markdown body ───────────────────────────────────────────────────────────── */

.md {
  color: var(--text-2);
  font-size: 13.5px;
  line-height: 1.65;
}

.md h1,
.md h2,
.md h3 {
  margin: 24px 0 10px;
  color: var(--text);
  font-weight: 600;
  letter-spacing: -0.01em;
}

.md h1 {
  font-size: 17px;
}

.md h2 {
  font-size: 14px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-soft);
}

.md h3 {
  font-size: 13px;
}

.md p {
  margin: 0 0 10px;
}

.md ul,
.md ol {
  margin: 0 0 10px;
  padding-left: 20px;
}

.md li {
  margin-bottom: 4px;
}

.md a {
  color: var(--blue);
  text-decoration: none;
}

.md a:hover {
  text-decoration: underline;
}

.md code {
  padding: 1.5px 5px;
  background: #232329;
  border-radius: 4px;
  color: #e6c07b;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px;
}

.md pre {
  margin: 0 0 12px;
  padding: 12px 14px;
  background: #08080a;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow-x: auto;
}

.md pre code {
  padding: 0;
  background: none;
  color: var(--text-2);
}

.md blockquote {
  margin: 0 0 12px;
  padding: 2px 0 2px 14px;
  border-left: 2px solid var(--accent);
  color: var(--text-3);
}

.md hr {
  margin: 20px 0;
  border: 0;
  border-top: 1px solid var(--border-soft);
}

.md strong {
  color: var(--text);
  font-weight: 600;
}

/* Task list — the checkboxes write straight back to the markdown file. */
.md .task {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 0 0 2px;
  padding: 4px 6px;
  margin-left: -6px;
  border-radius: var(--radius-sm);
  list-style: none;
  cursor: pointer;
}

.md .task:hover {
  background: var(--card);
}

.md .task input {
  margin: 3px 0 0;
  width: 14px;
  height: 14px;
  accent-color: var(--accent);
  cursor: pointer;
  flex: none;
}

.md .task.is-done > span {
  color: var(--text-4);
  text-decoration: line-through;
}

.md ul.tasks {
  padding-left: 0;
}

.progress-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0 18px;
  color: var(--text-3);
  font-size: 12px;
}

.progress-bar .track {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar .fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.25s var(--ease);
}

/* ── Toast ───────────────────────────────────────────────────────────────────── */

.toast {
  position: fixed;
  right: 16px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 13px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-pop);
  color: var(--text-2);
  font-size: 12.5px;
  animation: toast-in 0.18s var(--ease);
  z-index: 50;
}

.toast.is-err {
  border-color: #5a2a2c;
  color: #ffb4b4;
}

.toast code {
  color: var(--text-4);
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
}

@keyframes toast-in {
  from {
    transform: translateY(6px);
    opacity: 0;
  }
}

/* ── Help ────────────────────────────────────────────────────────────────────── */

.help {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgb(0 0 0 / 0.6);
  z-index: 60;
}

.help-card {
  width: 380px;
  padding: 20px 22px;
  background: var(--bg-header);
  border-radius: 12px;
  box-shadow: var(--shadow-pop);
}

.help-card h3 {
  margin: 0 0 14px;
  font-size: 14px;
}

.help-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  color: var(--text-3);
  font-size: 12.5px;
}

.help-row kbd {
  padding: 2px 7px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-2);
  font-family: inherit;
  font-size: 11px;
}

/* ── Filter bar + layout toggle ──────────────────────────────────────────────── */

.subheader {
  flex-wrap: wrap;
  height: auto;
  min-height: var(--subheader-h);
  padding: 8px 16px;
  gap: 8px;
}

.filter-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  min-width: 0;
}

.filter-ctl select {
  max-width: 120px;
}

.ctl.is-on {
  background: var(--accent-soft);
  border-color: #5e6ad266;
  color: var(--text);
}

.layout-toggle {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
}

.cmd-btn kbd {
  margin-left: 4px;
  padding: 1px 5px;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-4);
  font-family: inherit;
  font-size: 10px;
}

/* ── List view ───────────────────────────────────────────────────────────────── */

.list {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 0 12px 16px;
  scrollbar-width: thin;
}

.list-head,
.list-row {
  display: grid;
  grid-template-columns: 84px minmax(220px, 1.8fr) 110px 70px 120px 100px 48px 36px;
  gap: 8px;
  align-items: center;
  padding: 0 10px;
}

.list-head {
  position: sticky;
  top: 0;
  z-index: 2;
  height: 32px;
  background: var(--bg);
  border-bottom: 1px solid var(--border-soft);
  color: var(--text-4);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.list-row {

  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.1s;
}

.list-row:hover {

}

.list-row.is-selected {
  background: var(--card-active);
  box-shadow: inset 2px 0 0 var(--accent);
}

.list-row .lc-id {
  color: var(--text-4);
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11.5px;
}

.list-row .lc-title {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.list-row .lc-title .t {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  font-weight: 500;
}

.list-tasks {
  flex: none;
  color: var(--text-4);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.list-row .pill {
  font-size: 12px;
  font-weight: 500;
}

.list-row .muted {
  color: var(--text-4);
}

.list-row .lc-est {
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.list-empty {
  padding: 48px 16px;
  color: var(--text-4);
  text-align: center;
}

/* ── Command palette ─────────────────────────────────────────────────────────── */

.palette {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: start center;
  padding-top: 12vh;
  background: rgb(0 0 0 / 0.55);
  z-index: 70;
}

.palette-card {
  width: min(560px, calc(100vw - 32px));
  background: var(--bg-header);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-pop);
  overflow: hidden;
}

.palette-input-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-soft);
  color: var(--text-3);
}

.palette-input {
  flex: 1;
  background: none;
  border: 0;
  outline: 0;
  font-size: 15px;
  color: var(--text);
}

.palette-input::placeholder {
  color: var(--text-4);
}

.palette-input-row kbd {
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-4);
  font-family: inherit;
  font-size: 10px;
}

.palette-list {
  max-height: min(420px, 55vh);
  overflow: auto;
  padding: 6px;
  scrollbar-width: thin;
}

.palette-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  text-align: left;
}

.palette-row:hover,
.palette-row.is-active {
  background: var(--card-active);
  color: var(--text);
}

.palette-main {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.palette-id {
  flex: none;
  color: var(--text-4);
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11.5px;
}

.palette-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.palette-row kbd {
  flex: none;
  padding: 1px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-4);
  font-family: inherit;
  font-size: 10px;
}

.palette-empty {
  padding: 24px;
  color: var(--text-4);
  text-align: center;
}

.palette-foot {
  display: flex;
  gap: 14px;
  padding: 8px 14px;
  border-top: 1px solid var(--border-soft);
  color: var(--text-4);
  font-size: 11px;
}

@media (max-width: 960px) {
  .list-head,
  .list-row {
    grid-template-columns: 72px minmax(160px, 1fr) 90px 48px 36px;
  }

  .lc-project,
  .lc-cycle,
  .lc-est {
    display: none;
  }
}

   Two modes:

              live-reloads over SSE when a file changes on disk (yours or an agent's).
     static — a baked board.html (`track.mjs export`). Data is inlined; read-only.
   ═══════════════════════════════════════════════════════════════════════════════ */

  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v === null || v === undefined || v === false) continue;

    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);

    if (kid === null || kid === undefined || kid === false) continue;

/* ── Icons ───────────────────────────────────────────────────────────────────── */

const PIE_C = 2 * Math.PI * 3.5;

function pie(pct, color) {

}

function progressIcon(done, total) {

const I = {

    svg(`<circle cx="7" cy="7" r="6" fill="none" stroke="${c}" stroke-width="1.3"/><path d="M5.7 4.7l3.6 2.3-3.6 2.3z" fill="${c}"/>`, 13),

  dots: () => svg(`<circle cx="2.5" cy="7" r="1.1" fill="currentColor"/><circle cx="7" cy="7" r="1.1" fill="currentColor"/><circle cx="11.5" cy="7" r="1.1" fill="currentColor"/>`, 14),

  chevron: () => svg(`<path d="M5.4 3.2L9.2 7l-3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>`, 12),
  panel: () => svg(`<rect x="1.2" y="2.2" width="11.6" height="9.6" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5.2 2.4v9.2" stroke="currentColor" stroke-width="1.2"/>`, 14),
  filter: () => svg(`<path d="M1.6 3.2h10.8M3.4 7h7.2M5.4 10.8h3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>`, 14),

  search: () => svg(`<circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9.2 9.2l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>`, 13),

/* ── Formatting ──────────────────────────────────────────────────────────────── */

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const now = new Date();
  return d.getFullYear() === now.getFullYear()
    ? `${MONTHS[d.getMonth()]} ${d.getDate()}`
    : `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}

const fmtRange = (a, b) => (a && b ? `${fmtDate(a)} → ${fmtDate(b)}` : "");
const initials = (n) => n.split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();

/* ── Markdown (small, escaped-first — the body is rendered, never trusted) ────── */

function markdown(src) {
  const fences = [];
  let s = src.replace(/```[\w-]*\n([\s\S]*?)```/g, (_, code) => {
    fences.push(`<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`);
    return `␀F${fences.length - 1}␀`;
  });

  const inline = (t) =>
    esc(t)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, url) => `<a href="${esc(url)}" target="_blank" rel="noreferrer">${txt}</a>`);

  const out = [];
  let list = null; // 'ul' | 'ol' | 'tasks'
  let para = [];
  let taskIndex = 0;

  const flushPara = () => {
    if (para.length) {
      out.push(`<p>${inline(para.join(" "))}</p>`);
      para = [];
    }
  };
  const closeList = () => {
    if (list) {
      out.push(list === "tasks" ? "</ul>" : `</${list}>`);
      list = null;
    }
  };

  for (const raw of s.split("\n")) {
    const line = raw.replace(/\s+$/, "");
    const fence = line.match(/^␀F(\d+)␀$/);
    if (fence) {
      flushPara();
      closeList();
      out.push(fences[+fence[1]]);
      continue;
    }
    if (!line.trim()) {
      flushPara();
      closeList();
      continue;
    }

    const task = line.match(/^\s*[-*] \[([ xX])\]\s?(.*)$/);
    if (task) {
      flushPara();
      if (list !== "tasks") {
        closeList();
        out.push('<ul class="tasks">');
        list = "tasks";
      }
      const done = task[1].toLowerCase() === "x";
      out.push(
        `<li class="task${done ? " is-done" : ""}" data-task="${taskIndex++}">` +
          `<input type="checkbox"${done ? " checked" : ""}${STATIC ? " disabled" : ""}><span>${inline(task[2])}</span></li>`,
      );
      continue;
    }

    const head = line.match(/^(#{1,4})\s+(.*)$/);
    if (head) {
      flushPara();
      closeList();
      const lvl = Math.min(head[1].length, 3);
      out.push(`<h${lvl}>${inline(head[2])}</h${lvl}>`);
      continue;
    }

    if (/^(---|___|\*\*\*)\s*$/.test(line)) {
      flushPara();
      closeList();
      out.push("<hr>");
      continue;
    }

    const quote = line.match(/^>\s?(.*)$/);
    if (quote) {
      flushPara();
      closeList();
      out.push(`<blockquote>${inline(quote[1])}</blockquote>`);
      continue;
    }

    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      flushPara();
      const want = ul ? "ul" : "ol";
      if (list !== want) {
        closeList();
        out.push(`<${want}>`);
        list = want;
      }
      out.push(`<li>${inline((ul ?? ol)[1])}</li>`);
      continue;
    }

    para.push(line.trim());
  }
  flushPara();
  closeList();
  return out.join("\n");
}

/* ── API ─────────────────────────────────────────────────────────────────────── */

async function api(path, method = "GET", body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "content-type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error ?? `${res.status}`);
  return data;
}

let toastTimer;
function toast(msg, isErr = false) {
  document.querySelector(".toast")?.remove();
  const el = h("div", { class: `toast${isErr ? " is-err" : ""}`, html: msg });
  document.body.append(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

/** Optimistic: paint the change, write the file, reconcile from the SSE reload. */
async function patch(id, fields) {
  if (STATIC) return toast("Read-only export. Run <code>track.mjs board</code> to edit.", true);
  const issue = byId.get(id);
  const prev = { ...issue };
  Object.assign(issue, fields);
  render();
  try {
    await api(`/api/issues/${id}`, "PATCH", fields);
    const [k, v] = Object.entries(fields)[0];
    toast(`<strong>${id}</strong> ${k} → ${v ?? "none"} · <code>issues/${id}.md</code>`);
  } catch (e) {
    Object.assign(issue, prev);
    render();
    toast(`${id}: ${e.message}`, true);
  }
}

async function toggleTask(id, index, checked) {
  if (STATIC) return toast("Read-only export. Run <code>track.mjs board</code> to edit.", true);
  try {
    await api(`/api/issues/${id}/task`, "POST", { index, checked });
    await load();
  } catch (e) {
    toast(`${id}: ${e.message}`, true);
  }
}

/* ── Grouping ────────────────────────────────────────────────────────────────── */

/** Columns are derived from config, not from the data — so an empty cycle still shows. */
function columns() {
  switch (view.groupBy) {
    case "status":
      return (D.config.states ?? []).map((s) => ({ key: s.id, title: s.name, icon: statusIcon(s) }));
    case "project":
      return [
        { key: null, title: "No project" },
        ...D.projects.map((p) => ({ key: p.id, title: p.title ?? p.id, icon: I.project(p.color ?? "#8a8f98") })),
      ];
    case "priority":
      return (D.config.priorities ?? []).map((p) => ({ key: p.id, title: p.name, icon: priorityIcon(p.id) }));
    case "assignee":
      return [
        { key: null, title: "Unassigned" },
        ...(D.config.members ?? []).map((m) => ({ key: m.id, title: m.name })),
      ];
    case "cycle":
    default:
      return [
        { key: null, title: "No cycle" },
        ...(D.config.cycles ?? []).map((c) => ({
          key: c.id,
          title: c.name,
          sub: fmtRange(c.starts, c.ends),
          icon: I.cycle("#8a8f98"),
        })),
      ];
  }
}

function visible() {
  const q = view.query.trim().toLowerCase();
  const f = view.filters;
  return D.issues.filter((i) => {
    if (!view.showDone && !isOpen(i)) return false;
    if (f.status && i.status !== f.status) return false;
    if (f.priority && (i.priority ?? "none") !== f.priority) return false;
    if (f.project && (i.project ?? "") !== f.project) return false;
    if (f.cycle && (i.cycle ?? "") !== f.cycle) return false;
    if (f.assignee && (i.assignee ?? "") !== f.assignee) return false;
    if (f.tag && !(i.tags ?? []).includes(f.tag)) return false;
    if (!q) return true;
    const hay = [i.id, i.title, i.description, i.project, i.milestone, ...(i.tags ?? [])].join(" ").toLowerCase();
    return hay.includes(q);
  });
}

function activeFilterCount() {
  return Object.values(view.filters).filter(Boolean).length;
}

function clearFilters() {
  for (const k of Object.keys(view.filters)) view.filters[k] = "";
}

/* ── URL state (shareable views) ─────────────────────────────────────────────── */

const FILTER_KEYS = ["status", "priority", "project", "cycle", "assignee", "tag"];

function readUrl() {
  if (STATIC || typeof location === "undefined") return;
  const p = new URLSearchParams(location.search);
  if (p.get("layout") === "list" || p.get("layout") === "board") view.layout = p.get("layout");
  const g = p.get("group");
  if (g && ["cycle", "status", "project", "priority", "assignee"].includes(g)) view.groupBy = g;
  if (p.has("q")) view.query = p.get("q") ?? "";
  if (p.get("done") === "1") view.showDone = true;
  for (const k of FILTER_KEYS) {
    if (p.has(k)) view.filters[k] = p.get(k) ?? "";
  }
  const id = p.get("issue");
  if (id) view.selected = id;
}

function writeUrl() {
  if (STATIC || typeof history === "undefined") return;
  const p = new URLSearchParams();
  if (view.layout !== "board") p.set("layout", view.layout);
  if (view.groupBy !== "cycle") p.set("group", view.groupBy);
  if (view.query) p.set("q", view.query);
  if (view.showDone) p.set("done", "1");
  for (const k of FILTER_KEYS) {
    if (view.filters[k]) p.set(k, view.filters[k]);
  }
  if (view.selected) p.set("issue", view.selected);
  const s = p.toString();
  const next = s ? `${location.pathname}?${s}` : location.pathname;
  if (next !== `${location.pathname}${location.search}`) history.replaceState(null, "", next);
}

/** rank (explicit pick order) first, then urgent, then id. */
function sortCards(a, b) {
  const ra = a.rank == null ? 1e9 : Number(a.rank);
  const rb = b.rank == null ? 1e9 : Number(b.rank);
  if (ra !== rb) return ra - rb;
  const pa = prio(a.priority)?.sort ?? 9;
  const pb = prio(b.priority)?.sort ?? 9;
  if (pa !== pb) return pa - pb;
  const na = parseInt(String(a.id).replace(/\D/g, ""), 10);
  const nb = parseInt(String(b.id).replace(/\D/g, ""), 10);
  return na - nb;
}

/* ── Card ────────────────────────────────────────────────────────────────────── */

function cardEl(i) {
  const s = state(i.status);
  const parent = i.parent ? byId.get(i.parent) : null;
  const chips = [];

  const pIcon = priorityIcon(i.priority);
  if (pIcon) chips.push(h("span", { class: "chip chip--bare", title: `Priority: ${prio(i.priority).name}` }, pIcon));
  if (i.rank != null) chips.push(h("span", { class: "chip chip--bare", title: `Pick order ${i.rank}` }, h("span", { class: "t" }, `#${i.rank}`)));

  chips.push(
    h(
      "button",
      {
        class: "chip chip--ghost",
        title: "Open issue",
        onclick: (e) => {
          e.stopPropagation();
          openDrawer(i.id);
        },
      },
      I.dots(),
    ),
  );

  if (i.cycle) {
    const c = cycle(i.cycle);
    chips.push(h("span", { class: "chip", title: c?.goal ?? "" }, I.cycle(), h("span", { class: "t" }, (c?.name ?? i.cycle).replace(/^Stage /, ""))));
  }

  for (const t of i.tags ?? []) {
    const l = label(t);
    chips.push(h("span", { class: "chip", title: l.description ?? l.name }, h("span", { class: "dot", style: `background:${l.color}` }), h("span", { class: "t" }, l.name)));
  }

  if (i.project) {
    const p = project(i.project);
    chips.push(h("span", { class: "chip chip--project", title: p?.title ?? i.project }, I.project(), h("span", { class: "t" }, p?.short ?? p?.title ?? i.project)));
  }

  const blockers = (i.blocked_by ?? []).filter((b) => byId.get(b) && byId.get(b).status !== "done");
  if (blockers.length) {
    chips.push(
      h(
        "span",
        { class: "chip chip--blocked", title: `Blocked by ${blockers.join(", ")}` },
        I.blocked(),
        h("span", { class: "t" }, String(blockers.length)),
      ),
    );
  }

  if (i.tasks_total) {
    chips.push(
      h(
        "span",
        { class: "chip", title: `${i.tasks_done} of ${i.tasks_total} tasks done` },
        progressIcon(i.tasks_done, i.tasks_total),
        h("span", { class: "t" }, `${i.tasks_done}/${i.tasks_total}`),
      ),
    );
  }

  if (i.pr) chips.push(h("span", { class: "chip" }, I.branch(), h("span", { class: "t" }, `#${i.pr}`)));

  const m = i.assignee ? member(i.assignee) : null;

  return h(
    "div",
    {
      class: `card${view.selected === i.id ? " is-selected" : ""}`,
      draggable: STATIC ? null : "true",
      tabindex: "0",
      data: { id: i.id },
      onclick: () => openDrawer(i.id),
      onkeydown: (e) => {
        if (e.key === "Enter") openDrawer(i.id);
      },
      ondragstart: (e) => {
        e.dataTransfer.setData("text/plain", i.id);
        e.dataTransfer.effectAllowed = "move";
        e.currentTarget.classList.add("is-dragging");
      },
      ondragend: (e) => e.currentTarget.classList.remove("is-dragging"),
    },
    h(
      "div",
      { class: "card-top" },
      h("span", { class: "card-id" }, i.id),
      parent && h("span", { class: "card-parent" }, I.chevron(), h("span", { class: "t" }, parent.title)),
      h("span", { class: "spacer" }),
      m
        ? h("span", { class: "avatar", style: `background:${m.color}`, title: m.name }, initials(m.name))
        : h("span", { class: "avatar avatar--none", title: "Unassigned" }, "?"),
    ),
    h("div", { class: "card-title" }, statusIcon(s), h("span", { class: "t" }, i.title)),
    chips.length ? h("div", { class: "chips" }, chips) : null,
    h("div", { class: "card-foot" }, `Created ${fmtDate(i.created)}`),

}

/* ── Board ───────────────────────────────────────────────────────────────────── */

function boardEl() {
  const items = visible();
  const cols = columns();
  const board = h("div", { class: "board" });

  for (const col of cols) {
    const mine = items.filter((i) => (i[view.groupBy] ?? null) === col.key).sort(sortCards);

    const body = h(
      "div",
      {
        class: "col-body",
        ondragover: (e) => {
          if (STATIC) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          e.currentTarget.classList.add("is-over");
        },
        ondragleave: (e) => e.currentTarget.classList.remove("is-over"),
        ondrop: (e) => {
          e.preventDefault();
          e.currentTarget.classList.remove("is-over");
          const id = e.dataTransfer.getData("text/plain");
          const issue = byId.get(id);
          if (!issue || (issue[view.groupBy] ?? null) === col.key) return;
          patch(id, { [view.groupBy]: col.key });
        },
      },
      mine.length ? mine.map(cardEl) : h("div", { class: "col-empty" }, "—"),
    );

    board.append(
      h(
        "div",
        { class: "col" },
        h(
          "div",
          { class: "col-head" },
          col.icon ?? null,
          h("span", { class: "col-title" }, col.title),
          h("span", { class: "col-count" }, String(mine.length)),
          col.sub ? h("span", { class: "col-dates" }, col.sub) : null,
          h("span", { class: "spacer" }),
          h("button", { class: "icon-btn", title: "Column options" }, I.dots()),
          h(
            "button",
            {
              class: "icon-btn",
              title: `New issue in ${col.title}`,
              onclick: () => newIssue({ [view.groupBy]: col.key }),
            },
            I.plus(),
          ),
        ),
        body,
      ),
    );
  }
  return board;
}

/* ── Command palette (⌘K) ────────────────────────────────────────────────────── */

let paletteOpen = false;
let paletteQuery = "";
let paletteIndex = 0;

function closePalette() {
  paletteOpen = false;
  paletteQuery = "";
  paletteIndex = 0;
  document.querySelector(".palette")?.remove();
}

function paletteItems() {
  const q = paletteQuery.trim().toLowerCase();
  const items = [];

  const actions = [
    { id: "a:new", kind: "action", title: "Create issue", hint: "c", run: () => newIssue() },
    {
      id: "a:layout",
      kind: "action",
      title: view.layout === "board" ? "Switch to list view" : "Switch to board view",
      hint: "v",
      run: () => {
        view.layout = view.layout === "board" ? "list" : "board";
        writeUrl();
        render();
      },
    },
    {
      id: "a:done",
      kind: "action",
      title: view.showDone ? "Hide completed issues" : "Show completed issues",
      hint: "d",
      run: () => {
        view.showDone = !view.showDone;
        writeUrl();
        render();
      },
    },
    {
      id: "a:group",
      kind: "action",
      title: `Group by… (now: ${view.groupBy})`,
      hint: "g",
      run: () => {
        view.groupBy = GROUPS[(GROUPS.indexOf(view.groupBy) + 1) % GROUPS.length];
        writeUrl();
        render();
      },
    },
    {
      id: "a:clear",
      kind: "action",
      title: "Clear filters",
      run: () => {
        clearFilters();
        view.query = "";
        writeUrl();
        render();
      },
    },
    ...GROUPS.map((g) => ({
      id: `a:g-${g}`,
      kind: "action",
      title: `Group by ${g}`,
      run: () => {
        view.groupBy = g;
        writeUrl();
        render();
      },
    })),
  ];

  for (const a of actions) {
    if (!q || a.title.toLowerCase().includes(q)) items.push(a);
  }

  const issues = D.issues
    .filter((i) => {
      if (!q) return isOpen(i) || view.showDone;
      const hay = [i.id, i.title, i.project, i.milestone, ...(i.tags ?? [])].join(" ").toLowerCase();
      return hay.includes(q);
    })
    .sort(sortCards)
    .slice(0, 40)
    .map((i) => ({
      id: `i:${i.id}`,
      kind: "issue",
      title: i.title,
      hint: i.id,
      issue: i,
      run: () => openDrawer(i.id),
    }));

  items.push(...issues);
  return items;
}

function runPaletteItem(item) {
  closePalette();
  item.run();
}

function renderPalette() {
  document.querySelector(".palette")?.remove();
  if (!paletteOpen) return;

  const items = paletteItems();
  if (paletteIndex >= items.length) paletteIndex = Math.max(0, items.length - 1);

  const list = h("div", { class: "palette-list", role: "listbox" });
  if (!items.length) {
    list.append(h("div", { class: "palette-empty" }, "No matches"));
  } else {
    items.forEach((item, n) => {
      const row = h(
        "button",
        {
          class: `palette-row${n === paletteIndex ? " is-active" : ""}`,
          role: "option",
          "aria-selected": n === paletteIndex ? "true" : "false",
          onmousedown: (e) => {
            e.preventDefault();
            runPaletteItem(item);
          },
          onmouseenter: () => {
            paletteIndex = n;
            document.querySelectorAll(".palette-row").forEach((el, i) => el.classList.toggle("is-active", i === n));
          },
        },
        item.kind === "issue"
          ? h(
              "span",
              { class: "palette-main" },
              statusIcon(state(item.issue.status), 13),
              h("span", { class: "palette-id" }, item.hint),
              h("span", { class: "palette-title" }, item.title),
            )
          : h("span", { class: "palette-main" }, I.cmd(), h("span", { class: "palette-title" }, item.title)),
        item.kind === "action" && item.hint ? h("kbd", null, item.hint) : null,
      );
      list.append(row);
    });
  }

  const el = h(
    "div",
    {
      class: "palette",
      onclick: (e) => {
        if (e.target.classList.contains("palette")) closePalette();
      },
    },
    h(
      "div",
      { class: "palette-card", role: "dialog", "aria-label": "Command palette" },
      h(
        "div",
        { class: "palette-input-row" },
        I.search(),
        h("input", {
          class: "palette-input",
          type: "text",
          placeholder: "Jump to issue or run a command…",
          value: paletteQuery,
          oninput: (e) => {
            paletteQuery = e.target.value;
            paletteIndex = 0;
            renderPalette();
            document.querySelector(".palette-input")?.focus();
          },
          onkeydown: (e) => {
            const cur = paletteItems();
            if (e.key === "ArrowDown") {
              e.preventDefault();
              paletteIndex = Math.min(paletteIndex + 1, Math.max(0, cur.length - 1));
              renderPalette();
              document.querySelector(".palette-input")?.focus();
            } else if (e.key === "ArrowUp") {
              e.preventDefault();
              paletteIndex = Math.max(paletteIndex - 1, 0);
              renderPalette();
              document.querySelector(".palette-input")?.focus();
            } else if (e.key === "Enter") {
              e.preventDefault();
              if (cur[paletteIndex]) runPaletteItem(cur[paletteIndex]);
            } else if (e.key === "Escape") {
              e.preventDefault();
              closePalette();
            }
          },
        }),
        h("kbd", null, "esc"),
      ),
      list,
      h("div", { class: "palette-foot" }, h("span", null, "↑↓ navigate"), h("span", null, "↵ open"), h("span", null, `${items.length} results`)),
    ),
  );
  document.body.append(el);
  queueMicrotask(() => document.querySelector(".palette-input")?.focus());
}

function openPalette() {
  if (STATIC) {
    // Static export still supports jump-to; actions that write are guarded elsewhere.
  }
  paletteOpen = true;
  paletteQuery = "";
  paletteIndex = 0;
  renderPalette();
}

/* ── Drawer ──────────────────────────────────────────────────────────────────── */

function selectField(labelText, value, options, onChange) {
  return h(
    "div",
    { class: "field" },
    h("label", { class: "field-label" }, labelText),
    h(
      "select",
      {
        class: "field-value",
        disabled: STATIC ? "" : null,
        onchange: (e) => onChange(e.target.value === "__none" ? null : e.target.value),
      },
      options.map((o) =>
        h("option", { value: o.id ?? "__none", selected: (o.id ?? null) === (value ?? null) ? "" : null }, o.name),
      ),
    ),
  );
}

function openDrawer(id) {
  view.selected = id;
  writeUrl();
  closeDrawer(false);
  const i = byId.get(id);
  if (!i) return;

  const relRow = (rid, kind) => {
    const r = byId.get(rid);
    if (!r) return null;
    return h(
      "button",
      { class: "rel", title: `${kind} ${rid}`, onclick: () => openDrawer(rid) },
      statusIcon(state(r.status), 12),
      h("span", { class: "rid" }, rid),
      h("span", { class: "rt" }, r.title),
    );
  };

  const relations = [
    ...(i.blocked_by ?? []).map((r) => ({ r, kind: "Blocked by" })),
    ...(i.blocks ?? []).map((r) => ({ r, kind: "Blocks" })),
    ...(i.relates ?? []).map((r) => ({ r, kind: "Relates to" })),
  ];
  const grouped = new Map();
  for (const { r, kind } of relations) {
    if (!grouped.has(kind)) grouped.set(kind, []);
    grouped.get(kind).push(r);
  }

  const bodyHtml = markdown(i.body ?? "");

  const main = h("div", { class: "drawer-main" }, h("h1", { class: "drawer-title" }, i.title), i.description ? h("p", { class: "drawer-desc" }, i.description) : null);

  if (i.tasks_total) {
    const pct = Math.round((i.tasks_done / i.tasks_total) * 100);
    main.append(
      h(
        "div",
        { class: "progress-bar" },
        h("span", null, `${i.tasks_done}/${i.tasks_total}`),
        h("span", { class: "track" }, h("span", { class: "fill", style: `width:${pct}%` })),
        h("span", null, `${pct}%`),
      ),
    );
  }

  const mdEl = h("div", { class: "md", html: bodyHtml });
  mdEl.querySelectorAll(".task").forEach((li) => {
    li.addEventListener("click", (e) => {
      // preventDefault reverts the browser's pre-click toggle: the markdown file is the
      // source of truth, so we flip the *persisted* state (the class) and re-read from disk.
      // Reading `input.checked` here would see the already-toggled value and invert it back.
      e.preventDefault();
      toggleTask(i.id, Number(li.dataset.task), !li.classList.contains("is-done"));
    });
  });
  main.append(mdEl);

  const side = h(
    "div",
    { class: "drawer-side" },
    selectField("Status", i.status, (D.config.states ?? []).map((s) => ({ id: s.id, name: s.name })), (v) => patch(i.id, { status: v })),
    selectField("Priority", i.priority, (D.config.priorities ?? []).map((p) => ({ id: p.id, name: p.name })), (v) => patch(i.id, { priority: v })),
    selectField(
      "Assignee",
      i.assignee,
      [{ id: null, name: "Unassigned" }, ...(D.config.members ?? []).map((m) => ({ id: m.id, name: m.name }))],
      (v) => patch(i.id, { assignee: v }),
    ),
    selectField(
      "Project",
      i.project,
      [{ id: null, name: "No project" }, ...D.projects.map((p) => ({ id: p.id, name: p.title ?? p.id }))],
      (v) => patch(i.id, { project: v }),
    ),
    selectField(
      "Cycle",
      i.cycle,
      [{ id: null, name: "No cycle" }, ...(D.config.cycles ?? []).map((c) => ({ id: c.id, name: c.name }))],
      (v) => patch(i.id, { cycle: v }),
    ),
    selectField(
      "Estimate",
      i.estimate,
      [{ id: null, name: "—" }, ...(D.config.estimate_scale ?? []).map((n) => ({ id: n, name: `${n} pt` }))],
      (v) => patch(i.id, { estimate: v === null ? null : Number(v) }),
    ),
  );

  if (i.milestone) {
    side.append(h("div", { class: "field" }, h("label", { class: "field-label" }, "Milestone"), h("div", { class: "field-value" }, i.milestone)));
  }

  if ((i.tags ?? []).length) {
    side.append(
      h(
        "div",
        { class: "field" },
        h("label", { class: "field-label" }, "Labels"),
        h(
          "div",
          { class: "tag-row" },
          (i.tags ?? []).map((t) => {
            const l = label(t);
            return h("span", { class: "chip", title: l.description ?? "" }, h("span", { class: "dot", style: `background:${l.color}` }), h("span", { class: "t" }, l.name));
          }),
        ),
      ),
    );
  }

  for (const [kind, ids] of grouped) {
    side.append(h("div", { class: "field" }, h("label", { class: "field-label" }, kind), ids.map((r) => relRow(r, kind)).filter(Boolean)));
  }

  if (i.resource) {
    side.append(
      h(
        "div",
        { class: "field" },
        h("label", { class: "field-label" }, "Source"),
        h("div", { class: "field-value", style: "font-size:11.5px;word-break:break-all" }, I.doc(), i.resource),
      ),
    );
  }
  if (i.linear_id) {
    side.append(h("div", { class: "field" }, h("label", { class: "field-label" }, "Linear"), h("div", { class: "field-value" }, i.linear_id)));
  }

  const drawer = h(
    "div",
    { class: "drawer", role: "dialog", "aria-label": `${i.id} ${i.title}` },
    h(
      "div",
      { class: "drawer-head" },
      h("span", { class: "id" }, i.id),
      h("span", { class: "spacer" }),
      h("span", { class: "file" }, i.file),
      h("button", { class: "icon-btn", title: "Close (Esc)", onclick: () => closeDrawer() }, I.close()),
    ),
    h("div", { class: "drawer-body" }, main, side),
  );

  const scrim = h("div", { class: "scrim", onclick: () => closeDrawer() });
  document.body.append(scrim, drawer);
  render();
}

function closeDrawer(clearSel = true) {
  document.querySelector(".drawer")?.remove();
  document.querySelector(".scrim")?.remove();
  if (clearSel) {
    view.selected = null;
    writeUrl();
    render();
  }
}

async function newIssue(fields = {}) {
  if (STATIC) return toast("Read-only export. Run <code>track.mjs board</code> to add issues.", true);
  const title = prompt("New issue — title");
  if (!title?.trim()) return;
  try {
    const r = await api("/api/issues", "POST", { title: title.trim(), status: "todo", ...fields });
    await load();
    toast(`Created <strong>${r.id}</strong> · <code>${r.file}</code>`);
    openDrawer(r.id);
  } catch (e) {
    toast(e.message, true);
  }
}

/* ── Help ────────────────────────────────────────────────────────────────────── */

const KEYS = [
  ["⌘K / Ctrl+K", "Command palette"],
  ["/", "Search"],
  ["c", "New issue"],
  ["v", "Board / list layout"],
  ["g", "Cycle group-by"],
  ["d", "Show / hide done"],
  ["Esc", "Close"],
  ["?", "This dialog"],
];

function toggleHelp() {
  const open = document.querySelector(".help");
  if (open) return open.remove();
  const el = h(
    "div",
    { class: "help", onclick: (e) => e.target.classList.contains("help") && e.target.remove() },
    h(
      "div",
      { class: "help-card" },
      h("h3", null, "Keyboard"),
      KEYS.map(([k, d]) => h("div", { class: "help-row" }, h("span", null, d), h("kbd", null, k))),
    ),
  );
  document.body.append(el);
}

/* ── Render ──────────────────────────────────────────────────────────────────── */

const GROUPS = ["cycle", "status", "project", "priority", "assignee"];

function render() {
  writeUrl();
  const app = document.getElementById("app");
  const shown = visible();
  const scrolls = [...document.querySelectorAll(".col-body")].map((e) => e.scrollTop);
  const boardScroll = document.querySelector(".board")?.scrollLeft ?? 0;
  const listScroll = document.querySelector(".list")?.scrollTop ?? 0;

  app.replaceChildren(
    h(
      "div",
      { class: "header" },
      h("button", { class: "icon-btn", title: "Toggle sidebar" }, I.panel()),
      h(
        "div",
        { class: "crumbs" },
        h("button", { class: "crumb" }, h("span", { class: "glyph" }, I.code()), D.config.workspace?.name ?? "Workspace"),
        h("span", { class: "crumb-sep" }, "/"),
        h("button", { class: "crumb" }, h("span", { class: "glyph glyph--cycle" }, I.cycle()), "Engineering Cycle Planning Board"),
        h("button", { class: "icon-btn star", title: "Favorite" }, I.star()),
        h("button", { class: "icon-btn" }, I.dots()),
      ),
      h("span", { class: "spacer" }),
      h(
        "button",
        {
          class: "ctl cmd-btn",
          title: "Command palette (⌘K)",
          onclick: () => openPalette(),
        },
        I.cmd(),
        "Commands",
        h("kbd", null, "⌘K"),
      ),
      STATIC ? h("span", { class: "badge-ro" }, I.doc(), "Static export · read-only") : null,
    ),
    h(
      "div",
      { class: "subheader" },
      h("span", { class: "count" }, `${shown.length} issue${shown.length === 1 ? "" : "s"}`),
      filterBar(),
      h("span", { class: "spacer" }),
      h(
        "label",
        { class: "search" },
        I.search(),
        h("input", {
          type: "text",
          placeholder: "Search…",
          value: view.query,
          oninput: (e) => {
            view.query = e.target.value;
            writeUrl();
            render();
            document.querySelector(".search input")?.focus();
          },
        }),
        h("kbd", null, "/"),
      ),
      h(
        "button",
        {
          class: `ctl${view.showDone ? " is-on" : ""}`,
          title: "Show completed and canceled issues",
          onclick: () => {
            view.showDone = !view.showDone;
            writeUrl();
            render();
          },
        },
        I.filter(),
        view.showDone ? "All" : "Open",
      ),
      h(
        "div",
        { class: "layout-toggle", title: "Layout" },
        h(
          "button",
          {
            class: `icon-btn${view.layout === "board" ? " is-on" : ""}`,
            title: "Board view",
            onclick: () => {
              view.layout = "board";
              writeUrl();
              render();
            },
          },
          I.board(),
        ),
        h(
          "button",
          {
            class: `icon-btn${view.layout === "list" ? " is-on" : ""}`,
            title: "List view",
            onclick: () => {
              view.layout = "list";
              writeUrl();
              render();
            },
          },
          I.list(),
        ),
      ),
      view.layout === "board"
        ? h(
            "label",
            { class: "ctl", title: "Group by" },
            I.sliders(),
            h(
              "select",
              {
                onchange: (e) => {
                  view.groupBy = e.target.value;
                  writeUrl();
                  render();
                },
              },
              GROUPS.map((g) => h("option", { value: g, selected: view.groupBy === g ? "" : null }, g[0].toUpperCase() + g.slice(1))),
            ),
          )
        : null,
    ),
    view.layout === "list" ? listEl() : boardEl(),
  );

  document.querySelectorAll(".col-body").forEach((e, n) => (e.scrollTop = scrolls[n] ?? 0));
  const b = document.querySelector(".board");
  if (b) b.scrollLeft = boardScroll;
  const l = document.querySelector(".list");
  if (l) l.scrollTop = listScroll;
}

/* ── Load + live reload ──────────────────────────────────────────────────────── */

let urlBooted = false;

async function load() {
  D = STATIC ? window.__TRACK_DATA__ : await api("/api/state");
  byId = new Map(D.issues.map((i) => [i.id, i]));
  if (D.errors?.length) toast(`${D.errors.length} file(s) failed to parse — run <code>track.mjs lint</code>`, true);
  const drawerWasOpen = !!document.querySelector(".drawer");
  let openFromUrl = false;
  if (!urlBooted) {
    readUrl();
    openFromUrl = !!view.selected;
    urlBooted = true;
  }
  render();
  // Re-open the drawer after SSE reloads, or once from ?issue= on first paint.
  if (view.selected && byId.has(view.selected) && (drawerWasOpen || openFromUrl)) {
    openDrawer(view.selected);
  }
}

function keys(e) {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if (paletteOpen) closePalette();
    else openPalette();
    return;
  }
  if (e.key === "Escape") {
    if (paletteOpen) {
      closePalette();
      return;
    }
    document.querySelector(".help")?.remove();
    closeDrawer();
    if (typing) e.target.blur();
    return;
  }
  if (paletteOpen) return;
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") {
    e.preventDefault();
    document.querySelector(".search input")?.focus();
  } else if (e.key === "c") {
    newIssue();
  } else if (e.key === "d") {
    view.showDone = !view.showDone;
    writeUrl();
    render();
  } else if (e.key === "g") {
    view.groupBy = GROUPS[(GROUPS.indexOf(view.groupBy) + 1) % GROUPS.length];
    writeUrl();
    render();
  } else if (e.key === "v") {
    view.layout = view.layout === "board" ? "list" : "board";
    writeUrl();
    render();
  } else if (e.key === "?") {
    toggleHelp();
  }
}

document.addEventListener("keydown", keys);

if (!STATIC) {
  const es = new EventSource("/api/events");
  // Any write — a drag here, a `track set`, an agent editing the file, a git checkout —
  // lands on disk and comes back through here. The board is never the source of truth.
  es.addEventListener("changed", () => load());
}

load().catch((e) => {
  document.getElementById("app").innerHTML = `<div class="boot">Could not load: ${esc(e.message)}</div>`;
});

</script>
